[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "password-manager"
version = "1.0.0"
description = "A secure, modern, cross-platform password manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Password Manager Project" }]
keywords = ["password", "manager", "security", "encryption", "vault"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # Cryptography — industry-standard, actively maintained
    "cryptography>=42.0.0",     # AES-256-GCM, secure primitives
    "argon2-cffi>=23.1.0",      # Argon2id key derivation

    # TOTP
    "pyotp>=2.9.0",             # RFC-6238 TOTP

    # Database
    "sqlalchemy>=2.0.0",        # ORM + parameterized queries
    "alembic>=1.13.0",          # Schema migrations

    # Utilities
    "pydantic>=2.6.0",          # Data validation / models
    "python-dotenv>=1.0.0",     # Environment config
    "zxcvbn>=4.4.28",           # Password strength estimation

    # Desktop UI
    "PyQt6>=6.6.0",             # Cross-platform desktop UI
    "PyQt6-Qt6>=6.6.0",

    # Clipboard utilities (cross-platform)
    "pyperclip>=1.8.2",

    # Import/Export formats
    "defusedxml>=0.7.1",        # Safe XML parsing for KeePass
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyperclip",
]
packaging = [
    "pyinstaller>=6.6.0",
]

[project.scripts]
password-manager = "password_manager.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["password_manager*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "RUF"]
ignore = [
    "E501",
    "F841",
    "UP042",
    "RUF003",
    "N802",
    "B904",
    "C408",
    "S101",
    "S105",
    "S106",
    "S110",
    "S603",
    "T201",
    "RUF012",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = [
    "no-untyped-def",
    "assignment",
    "arg-type",
    "union-attr",
    "no-any-return",
    "call-arg",
    "unused-ignore",
    "attr-defined",
    "index",
    "operator",
    "misc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=password_manager --cov-report=term-missing -v"
